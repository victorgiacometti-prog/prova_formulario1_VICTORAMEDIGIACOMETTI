<body>

    <form>
    <h1>Exemplos de Formulário em HTML</h1>

    <hr>

    <h3>Exemplo 01</h3>
    
    <input class="fundo_ciano" type="text" name="nome" placeholder="Nome" required>
    <input class="fundo_ciano" type="email" name="email" placeholder="Email" required>
    <input class="fundo_ciano" type="tel" name="celular" placeholder="Celular" required>
    <input class="fundo_ciano" type="password" name="senha" placeholder="Senha" required>
    <input class="fundo_amarelo" type="submit" name="Cadastrar" value="Cadastrar">
    
    
    <hr>

    <h3>Exemplo 02</h3>
    <textarea class="fundo_ciano_textarea" type="text" name="ex2"></textarea>

    <hr>

    <div class="formulario">
    <h3>Exemplo 03</h3>
    <fieldset class="formulario">
        <legend>Formulário</legend>
        <label>Nome: <input type="text" name="nome" required></label>
        <p></p>
        <br>
        
        <label>Sexo: <input type="radio" name="Masculino"> Masculino <input type="radio" name="Feminino"> Feminino</label>
        <p></p>
        <br>

        <label>País: 
        <select>
            <option>Selecione uma opção</option>
            <option>Alemanha</option>
            <option>Argentina</option>
            <option>Austrália</option>
            <option>Brasil</option>
            <option>Canadá</option>
            <option>China</option>
            <option>Egito</option>
            <option>Espanha</option>
            <option>Estados Unidos</option>
            <option>França</option>
            <option>Índia</option>
            <option>Itália</option>
            <option>Japão</option>
            <option>México</option>
            <option>Nigéria</option>
            <option>Reino Unido</option>
            <option>Rússia</option>
            <option>África do Sul</option>
            <option>Coreia do Sul</option>
            <option>Uruguai</option>
        </select></label>
        <p></p>
        <br>

        <label>Mensagem: <br><textarea class="fixar_textarea" type="text" name="ex2"></textarea> </label>
        <p></p>
        <br>
        
        <input type="checkbox" name="assinatura"><label>Assinar Newsletter?</label>
        <p></p>
        <br>
        <input class="botao_azul" type="submit" name="Enviar">
    </fieldset>
    </div>

    </form>

    <form action="https://google.com" method="get">

    <hr>

    <h3>Exemplo 04</h3>
    <input class="textarea_vermelho" type="search" name="pesquisa"></textarea>
    <input class="clique_para_pesquisar" type="submit" name="Pesquisar" value="Clique para pesquisar">

     </form>
    <hr>

    <h3>Exemplo 05</h3>
    <fieldset class="cor_que_mais_agrada">
        <legend><i><b>Selecione a cor que mais agrada?</b></i></legend>
        <p></p>
        <input type="checkbox" name="cor1"><label><i><b>azul</b></i></label>
        <input type="checkbox" name="cor2"><label><i><b>vermelho</b></i></label>
        <input type="checkbox" name="cor3"><label><i><b>verde</b></i></label>
        <input type="checkbox" name="cor4"><label><i><b>amarelo</b></i></label>
        <p></p>
    </fieldset>
    </form>
